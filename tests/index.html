<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Automata City — Test Runner</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      background: #101b26;
      color: #e6eef5;
      line-height: 1.5;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 1.6rem;
    }
    .summary {
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .summary.ok {
      background: #0d7a52;
      color: #ffffff;
    }
    .summary.bad {
      background: #c93434;
      color: #ffffff;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .test {
      padding: 10px 14px;
      background: #182735;
      border-radius: 6px;
      border-left: 4px solid #4fdc9d;
    }
    .test.fail {
      border-left-color: #ff7a7a;
      background: #2b1d22;
      color: #ff9d9d;
    }
    .test pre {
      margin: 8px 0 0;
      font-size: 0.85rem;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Automata City — Browser Test Runner</h1>
  <div id="results">Running tests...</div>

  <!-- Framework and Core Modules -->
  <script src="../js/core/ac.js"></script>
  <script src="../js/core/progress.js"></script>

  <!-- Engine Modules -->
  <script src="../js/engine/render.js"></script>
  <script src="../js/engine/loop.js"></script>
  <script src="../js/engine/input.js"></script>
  <script src="../js/engine/camera.js"></script>
  <script src="../js/engine/tilemap.js"></script>
  <script src="../js/engine/collide.js"></script>
  <script src="../js/engine/audio.js"></script>

  <!-- World Modules -->
  <script src="../js/world/tiles.js"></script>
  <script src="../js/world/map-data.js"></script>
  <script src="../js/world/districts.js"></script>
  <script src="../js/world/triggers.js"></script>
  <script src="../js/world/hud.js"></script>
  <script src="../js/world/dialogue.js"></script>
  <script src="../js/world/shards.js"></script>
  <script src="../js/world/journal.js"></script>
  <script src="../js/world/npcs.js"></script>
  <script src="../js/world/companion.js"></script>
  <script src="../js/world/dressing.js"></script>
  <script src="../js/world/atmosphere.js"></script>
  <script src="../js/world/title.js"></script>
  <script src="../js/world/player.js"></script>
  <script src="../js/world/game.js"></script>

  <!-- Logic Modules -->
  <script src="../js/logic/strings.js"></script>
  <script src="../js/logic/sets.js"></script>
  <script src="../js/logic/tree.js"></script>
  <script src="../js/logic/dfa.js"></script>
  <script src="../js/logic/quiz.js"></script>

  <!-- Lesson Views & Shell -->
  <script src="../js/lessons/shell.js"></script>
  <script src="../js/lessons/lesson-player.js"></script>
  <script src="../js/lessons/drawings.js"></script>
  <script src="../js/lessons/str.js"></script>
  <script src="../js/lessons/set.js"></script>
  <script src="../js/lessons/tree.js"></script>
  <script src="../js/lessons/dfa.js"></script>
  <script src="../js/lessons/lessons-data.js"></script>
  <script src="../js/classic.js"></script>
  <script src="../js/main.js"></script>

  <!-- Test Harness & Suites -->
  <script src="harness.js"></script>
  <script src="ac.test.js"></script>
  <script src="progress.test.js"></script>
  <script src="engine.test.js"></script>
  <script src="map.test.js"></script>
  <script src="stations.test.js"></script>
  <script src="strings.test.js"></script>
  <script src="sets.test.js"></script>
  <script src="tree.test.js"></script>
  <script src="dfa.test.js"></script>
  <script src="mount.test.js"></script>
  <script src="regression.test.js"></script>
  <script src="lessons.test.js"></script>
  <script src="m4-world.test.js"></script>

  <script>
    (function () {
      const res = AC_TEST.runAll();
      const div = document.getElementById('results');
      div.innerHTML = `
        <div class="summary ${res.failed ? 'bad' : 'ok'}">
          ${res.failed === 0 ? '✓ All ' + res.passed + ' tests passed' : '✗ ' + res.failed + ' of ' + res.total + ' tests failed'}
        </div>
        <div class="list">
          ${res.results.map(r => `
            <div class="test ${r.ok ? 'pass' : 'fail'}">
              <b>${r.ok ? '✓' : '✗'}</b> ${r.name}
              ${r.error ? '<pre>' + (r.error.stack || r.error.message) + '</pre>' : ''}
            </div>
          `).join('')}
        </div>
      `;
    })();
  </script>
</body>
</html>
