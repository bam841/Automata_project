<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Automata City — Spritesheet Contact Sheet Tool</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #111b24;
      color: #e6eef5;
      padding: 20px;
      margin: 0;
    }
    h1 { margin-top: 0; font-size: 1.4rem; }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
      background: #1a2736;
      padding: 12px 16px;
      border-radius: 8px;
    }
    input, button, select {
      background: #243447;
      color: #fff;
      border: 1px solid #3c5472;
      padding: 6px 10px;
      border-radius: 4px;
    }
    .sheet-container {
      position: relative;
      display: inline-block;
      border: 2px solid #4a6785;
      background: #000;
      image-rendering: pixelated;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
    }
    .info {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #9cb3c9;
    }
  </style>
</head>
<body>
  <h1>Spritesheet Contact Sheet Tool</h1>
  <div class="controls">
    <label>Load image: <input type="file" id="file-input" accept="image/*"></label>
    <label>Tile Size:
      <select id="tile-size">
        <option value="16" selected>16 x 16</option>
        <option value="24">16 x 24</option>
        <option value="32">32 x 32</option>
      </select>
    </label>
    <label>Zoom:
      <select id="zoom">
        <option value="2">2x</option>
        <option value="3" selected>3x</option>
        <option value="4">4x</option>
      </select>
    </label>
  </div>
  <div class="sheet-container">
    <canvas id="view-canvas"></canvas>
  </div>
  <div id="info" class="info">Load an image above to overlay cell coordinates and tile indices.</div>

  <script>
    const fileInput = document.getElementById('file-input');
    const tileSizeSelect = document.getElementById('tile-size');
    const zoomSelect = document.getElementById('zoom');
    const canvas = document.getElementById('view-canvas');
    const ctx = canvas.getContext('2d');
    const info = document.getElementById('info');

    let currentImg = null;

    function render() {
      if (!currentImg) return;
      const tw = parseInt(tileSizeSelect.value, 10);
      const th = tw === 24 ? 24 : tw;
      const zoom = parseInt(zoomSelect.value, 10);

      const cols = Math.floor(currentImg.width / tw);
      const rows = Math.floor(currentImg.height / th);

      canvas.width = currentImg.width * zoom;
      canvas.height = currentImg.height * zoom;

      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(currentImg, 0, 0, canvas.width, canvas.height);

      ctx.font = `${Math.max(9, zoom * 3.5)}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const idx = r * cols + c;
          const x = c * tw * zoom;
          const y = r * th * zoom;
          const w = tw * zoom;
          const h = th * zoom;

          // Grid line
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 0.5, y + 0.5, w, h);

          // Index tag
          ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
          ctx.fillRect(x + 2, y + 2, 22 * (zoom / 2), 12 * (zoom / 2));
          ctx.fillStyle = '#fffa65';
          ctx.fillText(idx, x + 12 * (zoom / 2), y + 8 * (zoom / 2));
        }
      }

      info.textContent = `Dimensions: ${currentImg.width}x${currentImg.height}px | Grid: ${cols} cols × ${rows} rows (${cols * rows} tiles total). Click a tile to inspect.`;
    }

    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          currentImg = img;
          render();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    tileSizeSelect.addEventListener('change', render);
    zoomSelect.addEventListener('change', render);
  </script>
</body>
</html>
